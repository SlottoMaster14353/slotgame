=<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Timber Slots</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
body{
  font-family: system-ui;
  background: radial-gradient(circle at top,#1a1a1a,#05060f);
  color:white;
}

/* rustic casino inspired UI (NOT exact copy of any game) */
.glass{
  background: linear-gradient(145deg,#1f2937,#0b1220);
  border:2px solid #fbbf24;
  box-shadow:0 0 25px rgba(251,191,36,.15);
  border-radius:18px;
}

.reels-wrap{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:12px;
}

.reel{
  width:68px;
  height:180px;
  overflow:hidden;
  border-radius:12px;
  border:2px solid #fbbf24;
  background:#0b1220;
}

.reel-strip{
  display:flex;
  flex-direction:column;
  transition:transform 2s cubic-bezier(.2,.9,.2,1);
}

.symbol{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  border-bottom:1px solid #1f2a44;
}

.bet-btn{
  padding:6px 10px;
  background:#111827;
  border:1px solid #374151;
  border-radius:10px;
}

.bet-btn.active{
  border-color:#fbbf24;
  box-shadow:0 0 10px #fbbf24;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:340px;
  background:#0f172a;
  border:2px solid #fbbf24;
  border-radius:16px;
  padding:18px;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="flex justify-between items-center p-4">
  <div class="text-yellow-400 font-bold text-xl">NEON TIMBER SLOTS</div>

  <div class="text-right glass px-4 py-2">
    <div class="text-xs text-gray-300">BALANCE</div>
    <div id="balance" class="text-2xl text-green-400 font-bold">50000</div>
  </div>
</div>

<!-- REELS -->
<div class="reels-wrap glass mx-4">
  <div id="reels"></div>
</div>

<!-- BET UI -->
<div class="flex justify-center gap-2 mt-4 flex-wrap" id="bets"></div>

<div class="flex justify-center items-center gap-6 mt-4">
  <div>BET: <span id="bet">100</span></div>

  <button onclick="spin()" class="px-10 py-3 bg-yellow-500 text-black font-bold rounded-xl">
    SPIN
  </button>

  <button onclick="openInfo()" class="w-10 h-10 bg-gray-700 rounded-xl">
    <i class="fas fa-info"></i>
  </button>
</div>

<div id="msg" class="text-center mt-3 h-6"></div>

<!-- INFO -->
<div id="info" class="modal">
  <div class="modal-box text-sm">
    <h2 class="text-yellow-400 text-lg mb-2">GAME INFO</h2>

    <p class="text-gray-300 mb-2">
      5x3 Reels • 243 Ways • Weighted RNG
    </p>

    <p class="text-gray-400 text-xs mb-2">
      DISCLAIMER: Simulation game with weighted odds system.
    </p>

    <button onclick="closeInfo()" class="bg-red-500 px-3 py-1 rounded">CLOSE</button>
  </div>
</div>

<script>
const symbols=[
 {s:"⭐",w:30,v:2},
 {s:"🌙",w:25,v:3},
 {s:"🪐",w:20,v:5},
 {s:"🚀",w:12,v:8},
 {s:"💎",w:8,v:15},
 {s:"🔥",w:5,v:25}
];

let balance=50000;
let bet=100;
let reels=[];
let spinning=false;

function weighted(){
 let pool=[];
 symbols.forEach(o=>{for(let i=0;i<o.w;i++)pool.push(o);});
 return pool[Math.floor(Math.random()*pool.length)];
}

function init(){
 const r=document.getElementById("reels");
 r.innerHTML="";
 reels=[];

 for(let i=0;i<5;i++){
  let reel=document.createElement("div");
  reel.className="reel";

  let strip=document.createElement("div");
  strip.className="reel-strip";

  for(let j=0;j<18;j++){
   let d=document.createElement("div");
   d.className="symbol";
   d.textContent=weighted().s;
   strip.appendChild(d);
  }

  reel.appendChild(strip);
  r.appendChild(reel);
  reels.push(strip);
 }

 createBets();
 update();
}

function createBets(){
 const bets=[25,50,100,500,1000,2000];
 const box=document.getElementById("bets");
 box.innerHTML="";

 bets.forEach(b=>{
  let btn=document.createElement("button");
  btn.textContent=b;
  btn.className="bet-btn";
  btn.onclick=()=>{bet=b;update();};
  box.appendChild(btn);
 });
}

function update(){
 document.getElementById("balance").textContent=balance;
 document.getElementById("bet").textContent=bet;
}

function countWin(grid){
 let win=0;
 for(let row=0;row<3;row++){
  let sym=grid[0][row];
  let streak=1;

  for(let col=1;col<5;col++){
   if(grid[col][row].s===sym.s) streak++;
   else break;
  }

  if(streak>=3) win+=sym.v*streak;
 }
 return win;
}

async function spin(){
 if(spinning||balance<bet)return;
 spinning=true;
 balance-=bet;
 update();
 msg("Spinning...");

 let grid=[];
 for(let c=0;c<5;c++){
  let col=[];
  for(let r=0;r<3;r++) col.push(weighted());
  grid.push(col);
 }

 reels.forEach(r=>r.style.transform="translateY(-400px)");

 await new Promise(r=>setTimeout(r,2000));

 reels.forEach((r,i)=>{
  r.style.transition="none";
  r.style.transform="translateY(0)";
  r.innerHTML="";

  grid[i].forEach(o=>{
   let d=document.createElement("div");
   d.className="symbol";
   d.textContent=o.s;
   r.appendChild(d);
  });
 });

 let win=countWin(grid);
 if(win>0){
  balance+=win*bet;
  msg("WIN +"+win);
 } else msg("NO WIN");

 update();
 spinning=false;
}

function msg(t){document.getElementById("msg").textContent=t;}

function openInfo(){document.getElementById("info").style.display="flex";}
function closeInfo(){document.getElementById("info").style.display="none";}

window.onload=init;
</script>

</body>
</html>
