<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Casino Slot</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="machine">

  <div class="header">
    <div>BALANCE: $<span id="balance"></span></div>
    <div>BET: $<span id="bet"></span></div>
    <div>JACKPOT: $<span id="jackpot"></span></div>
  </div>

  <div id="reels" class="reels"></div>

  <div class="controls">
    <button onclick="changeBet(-10)">-</button>
    <button id="spinBtn" onclick="spin()">SPIN</button>
    <button onclick="changeBet(10)">+</button>
  </div>

  <canvas id="wheelCanvas" width="300" height="300"></canvas>

  <div id="popup" class="popup"></div>

</div>

<script src="script.js"></script>
</body>
</html>
