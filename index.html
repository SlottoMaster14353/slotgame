<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM GALAXIES FIXED</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap');

body {
  font-family: 'Exo 2', system-ui;
  background: linear-gradient(to bottom, #0a0a2e, #1a0033);
}

.reel {
  width: 92px;
  height: 198px;
  overflow: hidden;
  background: #0f0f2e;
  border: 6px solid #67e8f9;
  border-radius: 14px;
  box-shadow: 0 0 30px #22d3ee;
  position: relative;
}

.reel-strip {
  display: flex;
  flex-direction: column;
  transition: transform 2.6s cubic-bezier(0.25, 1, 0.3, 1);
  will-change: transform;
}

.symbol {
  height: 66px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  border-bottom: 2px solid #334155;
  background: rgba(15, 15, 46, 0.8);
}

.locked::after {
  content: '';
  position: absolute;
  inset: 4px;
  border: 4px solid #c026d3;
  border-radius: 10px;
}

#infoModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.modal-box {
  background: #0f172a;
  border: 3px solid #67e8f9;
  padding: 25px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
}
</style>
</head>

<body class="text-white">

<div class="max-w-5xl mx-auto p-6">

<h1 class="text-4xl font-bold text-cyan-300 mb-6">QUANTUM GALAXIES FIXED</h1>

<!-- REELS -->
<div class="flex gap-4 justify-center mb-6" id="reels"></div>

<!-- CONTROLS -->
<button onclick="spin()" id="spinBtn" class="bg-pink-600 px-10 py-4 rounded-xl">SPIN</button>

<button onclick="showInfo()" class="ml-4 bg-cyan-600 px-6 py-4 rounded-xl">
<i class="fas fa-info"></i>
</button>

<div id="message" class="mt-4 text-xl"></div>

</div>

<!-- INFO MODAL -->
<div id="infoModal">
  <div class="modal-box">
    <h2 class="text-2xl mb-3 text-cyan-300">Game Info</h2>
    <p class="text-sm mb-4">
      5 reels • 3 rows • 243 ways<br>
      6+ orbs trigger bonus
    </p>
    <button onclick="closeInfo()" class="bg-red-500 px-4 py-2 rounded">CLOSE</button>
  </div>
</div>

<script>
const reelStrip = ['⭐','🌟','🌙','🪐','☄️','🚀','🌌','🛸','🔥','💎','🎇','⚙️'];

let reels = [];
let isSpinning = false;

function createReels(){
  const container = document.getElementById('reels');
  container.innerHTML = '';
  reels = [];

  for(let i=0;i<5;i++){
    const reel = document.createElement('div');
    reel.className = 'reel';

    const strip = document.createElement('div');
    strip.className = 'reel-strip';

    for(let j=0;j<20;j++){
      const s = document.createElement('div');
      s.className = 'symbol';
      s.textContent = reelStrip[Math.floor(Math.random()*reelStrip.length)];
      strip.appendChild(s);
    }

    reel.appendChild(strip);
    container.appendChild(reel);
    reels.push(strip);
  }
}

function getSymbol(){
  return reelStrip[Math.floor(Math.random()*reelStrip.length)];
}

async function spin(){
  if(isSpinning) return;
  isSpinning = true;

  document.getElementById('message').textContent = "SPINNING...";

  const results = [];

  for(let r=0;r<5;r++){
    const col = [];
    for(let i=0;i<3;i++){
      col.push(getSymbol());
    }
    results.push(col);
  }

  // ANIMATE FIRST
  reels.forEach((strip, i)=>{
    strip.style.transition = "transform 2.2s ease-out";
    strip.style.transform = `translateY(-600px)`;
  });

  await new Promise(r=>setTimeout(r,2200));

  // RESET + REBUILD (FIXED PART)
  reels.forEach((strip, r)=>{
    strip.style.transition = "none";
    strip.style.transform = "translateY(0px)";
    strip.innerHTML = "";

    for(let i=0;i<3;i++){
      const d = document.createElement('div');
      d.className = 'symbol';
      d.textContent = results[r][i];
      strip.appendChild(d);
    }

    // fill extra for smooth scroll
    for(let i=0;i<10;i++){
      const d = document.createElement('div');
      d.className = 'symbol';
      d.textContent = getSymbol();
      strip.appendChild(d);
    }
  });

  document.getElementById('message').textContent = "RESULTS READY";
  isSpinning = false;
}

function showInfo(){
  document.getElementById('infoModal').style.display = 'flex';
}

function closeInfo(){
  document.getElementById('infoModal').style.display = 'none';
}

window.onload = ()=>{
  createReels();
};
</script>

</body>
</html>
