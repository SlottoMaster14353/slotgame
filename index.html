<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOIDSPIN v2 • Quantum Cascade Engine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg"></div>

<div class="machine">

  <div class="top">
    <h1>VOIDSPIN v2</h1>
    <button id="info">ⓘ</button>
  </div>

  <div class="stats">
    <div>💰 <span id="bal">5000</span></div>
    <div>🎲 <span id="bet">50</span></div>
    <div>🔥 <span id="jackpot">12500</span></div>
  </div>

  <div class="reels" id="reels"></div>

  <div class="controls">
    <button onclick="changeBet(-10)">-</button>
    <button id="spin">SPIN</button>
    <button onclick="auto()">AUTO</button>
    <button onclick="holdMode()">HOLD</button>
  </div>

  <div id="win"></div>

</div>

<!-- BONUS WHEEL -->
<div id="wheelModal">
  <div class="wheelBox">
    <h2>QUANTUM BONUS WHEEL</h2>
    <div id="wheel"></div>
    <button onclick="closeWheel()">CLOSE</button>
  </div>
</div>

<script src="engine.js"></script>
</body>
</html>
