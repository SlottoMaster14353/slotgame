<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM GALAXIES</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap');
body{font-family:'Exo 2',system-ui;background:radial-gradient(circle,#141428,#05060f);color:white;}

.reel{width:92px;height:192px;overflow:hidden;border-radius:14px;border:3px solid #67e8f9;background:#0b1220;position:relative;}
.reel-strip{display:flex;flex-direction:column;transition:transform 2.2s cubic-bezier(.2,.9,.2,1);}
.symbol{height:64px;display:flex;align-items:center;justify-content:center;font-size:40px;border-bottom:1px solid #1f2a44;}

.btn{padding:6px 10px;border-radius:10px;background:#111827;border:1px solid #374151}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:50;}
.modal-box{width:360px;background:#0f172a;border:2px solid #67e8f9;border-radius:16px;padding:16px;}

#wheel{
  width:240px;height:240px;border-radius:50%;
  border:6px solid #fbbf24;margin:auto;
  position:relative;transition:transform 4s cubic-bezier(.2,.9,.2,1);
}

.segment{position:absolute;width:50%;height:50%;transform-origin:100% 100%;background:conic-gradient(#1f2937,#111827);}

#lineOverlay{
  position:absolute;inset:0;pointer-events:none;
}

.line{
  position:absolute;height:2px;background:red;opacity:.7;
}
</style>
</head>
<body class="min-h-screen py-6">

<div class="max-w-6xl mx-auto px-4">

<div class="flex justify-between mb-3">
  <h1 class="text-3xl text-cyan-300 font-bold">QUANTUM GALAXIES</h1>
  <div>Balance: <span id="balance">50000</span></div>
</div>

<div>Jackpot: <span id="jp">100000</span></div>

<div class="flex justify-center gap-4 my-4" id="reels"></div>

<div class="flex justify-center gap-2">
<button class="btn" onclick="changeBet(-50)">-</button>
<div>BET <span id="bet">100</span></div>
<button class="btn" onclick="changeBet(50)">+</button>
</div>

<div class="flex justify-center gap-3 mt-3">
<button class="btn" onclick="spin()">SPIN</button>
<button class="btn" onclick="autoToggle()">AUTO</button>
<button class="btn" onclick="turboToggle()">TURBO</button>
<button class="btn" onclick="openWheel()">WHEEL</button>
</div>

<div id="msg" class="text-center mt-2"></div>

<div id="lineOverlay"></div>

</div>

<!-- WHEEL -->
<div id="wheelModal" class="modal">
  <div class="modal-box text-center">
    <div id="wheel"></div>
    <button onclick="spinWheel()" class="btn mt-3">SPIN WHEEL</button>
  </div>
</div>

<audio id="spinSnd"></audio>
<audio id="winSnd"></audio>

<script>
let balance=50000,bet=100,reels=[],auto=false,turbo=false,jackpot=100000;
const sym=['A','B','C','D','E','F'];

function beep(freq,dur){
  let ctx=new (window.AudioContext||window.webkitAudioContext)();
  let o=ctx.createOscillator();
  let g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.frequency.value=freq;o.start();g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
  setTimeout(()=>o.stop(),dur*1000);
}

function rand(){return sym[Math.floor(Math.random()*sym.length)];}

function create(){
  let c=document.getElementById('reels');c.innerHTML='';reels=[];
  for(let i=0;i<5;i++){
    let r=document.createElement('div');r.className='reel';
    let s=document.createElement('div');s.className='reel-strip';
    for(let j=0;j<20;j++){
      let d=document.createElement('div');d.className='symbol';d.textContent=rand();s.appendChild(d);
    }
    r.appendChild(s);c.appendChild(r);reels.push(s);
  }
}

function changeBet(v){bet=Math.max(50,bet+v);document.getElementById('bet').textContent=bet;}

function spin(){
  reels.forEach(r=>r.style.transform='translateY(-520px)');
  beep(200,0.1);

  setTimeout(()=>{
    let grid=[];
    for(let i=0;i<5;i++){grid[i]=[];for(let j=0;j<3;j++)grid[i][j]=rand();}

    reels.forEach((r,i)=>{
      r.innerHTML='';r.style.transition='none';r.style.transform='translateY(0)';
      grid[i].forEach(v=>{let d=document.createElement('div');d.className='symbol';d.textContent=v;r.appendChild(d);});
    });

    check243(grid);
    jackpot+=bet*0.05;
    document.getElementById('jp').textContent=Math.floor(jackpot);

    if(Math.random()<0.15)openWheel();

    if(auto)setTimeout(spin,turbo?300:1200);
  },turbo?800:2000);
}

function check243(g){
  let win=0;
  let lines=[];

  for(let r=0;r<3;r++){
    let sym=g[0][r];
    let count=1;
    for(let c=1;c<5;c++){
      if(g[c][r]==sym)count++; else break;
    }
    if(count>=3){win+=bet*10;lines.push(r);}
  }

  if(win>0){
    balance+=win;
    document.getElementById('balance').textContent=balance;
    drawLines(lines);
    beep(600,0.2);
  }
}

function drawLines(lines){
  let o=document.getElementById('lineOverlay');o.innerHTML='';
  lines.forEach(l=>{
    let d=document.createElement('div');d.className='line';d.style.top=(120+l*64)+'px';d.style.left='0';d.style.width='100%';o.appendChild(d);
  });
}

function autoToggle(){auto=!auto;if(auto)spin();}
function turboToggle(){turbo=!turbo;}

function openWheel(){document.getElementById('wheelModal').style.display='flex';buildWheel();}
function buildWheel(){
  let w=document.getElementById('wheel');w.innerHTML='';
  for(let i=0;i<6;i++){
    let s=document.createElement('div');s.className='segment';s.style.transform=`rotate(${i*60}deg)`;w.appendChild(s);
  }
}

function spinWheel(){
  let deg=3600+Math.random()*360;
  document.getElementById('wheel').style.transform=`rotate(${deg}deg)`;
  setTimeout(()=>{balance+=1000;document.getElementById('balance').textContent=balance;},4000);
}

window.onload=create;
</script>

</body>
</html>
