<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCKY REELS - $5000 Casino Slot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      font-family: 'Press Start 2P', system-ui;
    }

    .reel {
      height: 180px;
      overflow: hidden;
      background: #111;
      border: 4px solid #facc15;
      position: relative;
    }

    .reel-container {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .symbol {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      transition: all 0.1s;
    }

    .spinning .symbol {
      animation: spin 0.08s linear infinite;
    }

    @keyframes spin {
      0% { transform: translateY(-60px); }
      100% { transform: translateY(60px); }
    }

    .win-flash {
      animation: winFlash 0.6s ease-in-out 3;
    }

    @keyframes winFlash {
      0%, 100% { background-color: #22c55e; }
      50% { background-color: #eab308; }
    }

    .machine {
      background: linear-gradient(180deg, #1f2937, #111827);
      border: 8px solid #facc15;
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.6);
    }
  </style>
</head>
<body class="bg-zinc-950 text-yellow-300 min-h-screen py-8">
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-5xl font-bold tracking-widest text-yellow-400 mb-2">LUCKY REELS</h1>
      <p class="text-xl text-amber-400">CASINO EDITION</p>
    </div>

    <!-- Balance & Bet -->
    <div class="flex justify-between items-center mb-6 px-4">
      <div>
        <div class="text-sm text-gray-400">BALANCE</div>
        <div id="balance" class="text-3xl font-bold text-green-400">$5,000</div>
      </div>
      <div class="text-center">
        <div class="text-sm text-gray-400">BET</div>
        <div class="flex gap-2">
          <button onclick="setBet(10)" class="bet-btn px-4 py-2 bg-zinc-800 hover:bg-yellow-600 rounded border border-yellow-400 text-sm">10</button>
          <button onclick="setBet(50)" class="bet-btn px-4 py-2 bg-zinc-800 hover:bg-yellow-600 rounded border border-yellow-400 text-sm">50</button>
          <button onclick="setBet(100)" class="bet-btn px-4 py-2 bg-zinc-800 hover:bg-yellow-600 rounded border border-yellow-400 text-sm active">100</button>
          <button onclick="setBet(500)" class="bet-btn px-4 py-2 bg-zinc-800 hover:bg-yellow-600 rounded border border-yellow-400 text-sm">500</button>
        </div>
      </div>
      <div>
        <div class="text-sm text-gray-400">CURRENT BET</div>
        <div id="currentBet" class="text-3xl font-bold">$100</div>
      </div>
    </div>

    <!-- Slot Machine -->
    <div class="machine rounded-2xl p-8 mx-4">
      <div class="reel-container mb-8">
        <div id="reel1" class="reel w-24 rounded-xl flex flex-col"></div>
        <div id="reel2" class="reel w-24 rounded-xl flex flex-col"></div>
        <div id="reel3" class="reel w-24 rounded-xl flex flex-col"></div>
      </div>

      <!-- Controls -->
      <div class="flex gap-4 justify-center">
        <button onclick="spin()" id="spinBtn"
          class="flex-1 bg-red-600 hover:bg-red-700 transition-all active:scale-95 text-white font-bold text-2xl py-6 rounded-xl shadow-lg flex items-center justify-center gap-3">
          <i class="fas fa-play"></i> SPIN
        </button>
      </div>

      <div id="message" class="text-center mt-6 h-10 text-lg font-bold text-yellow-300"></div>
    </div>

    <!-- Info -->
    <div class="mt-8 px-4 text-center text-xs text-gray-500">
      <p>3 BONUS symbols → FEATURE SPIN BONUS!</p>
      <p class="mt-1">Big wins trigger confetti • Pure HTML/JS • True RNG</p>
    </div>
  </div>

  <script>
    // Symbols with emojis
    const symbols = ['🍒', '🍋', '🍊', '🍉', '🛎️', '⭐', '💎', '🎰'];
    const bonusSymbol = '🎰';

    let balance = 5000;
    let currentBet = 100;
    let isSpinning = false;

    const reels = [
      document.getElementById('reel1'),
      document.getElementById('reel2'),
      document.getElementById('reel3')
    ];

    const balanceEl = document.getElementById('balance');
    const betEl = document.getElementById('currentBet');
    const messageEl = document.getElementById('message');
    const spinBtn = document.getElementById('spinBtn');

    // Audio Context for sound effects
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      initAudio();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      switch(type) {
        case 'spin':
          oscillator.type = 'sawtooth';
          oscillator.frequency.setValueAtTime(120, audioCtx.currentTime);
          gain.gain.value = 0.15;
          setTimeout(() => gain.gain.value = 0, 800);
          break;
        case 'win':
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.value = 0.3;
          setTimeout(() => { oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime); }, 100);
          break;
        case 'bigwin':
          oscillator.type = 'sine';
          gain.gain.value = 0.4;
          let freq = 600;
          for (let i = 0; i < 8; i++) {
            setTimeout(() => {
              oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
              freq += 180;
            }, i * 80);
          }
          break;
        case 'coin':
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(1400, audioCtx.currentTime);
          gain.gain.value = 0.2;
          setTimeout(() => gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4), 10);
          break;
        case 'bonus':
          oscillator.type = 'square';
          gain.gain.value = 0.25;
          oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
          setTimeout(() => oscillator.frequency.setValueAtTime(800, audioCtx.currentTime), 120);
          break;
      }

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      setTimeout(() => oscillator.stop(), 1200);
    }

    function createReelHTML() {
      return reels.map(reel => {
        reel.innerHTML = '';
        for (let i = 0; i < 12; i++) {
          const sym = document.createElement('div');
          sym.className = 'symbol';
          sym.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          reel.appendChild(sym);
        }
      });
    }

    function setBet(amount) {
      if (isSpinning) return;
      currentBet = amount;
      betEl.textContent = '$' + amount;
      document.querySelectorAll('.bet-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.textContent) === amount);
      });
    }

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    async function spin() {
      if (isSpinning || balance < currentBet) {
        if (balance < currentBet) showMessage("NOT ENOUGH CREDITS!", "red");
        return;
      }

      isSpinning = true;
      balance -= currentBet;
      balanceEl.textContent = '$' + balance.toLocaleString();
      spinBtn.disabled = true;
      spinBtn.style.opacity = "0.6";

      playSound('spin');
      showMessage("SPINNING...", "yellow");

      // Start spinning animation
      reels.forEach(reel => reel.classList.add('spinning'));

      // Generate final results
      const result = [
        getRandomSymbol(),
        getRandomSymbol(),
        getRandomSymbol()
      ];

      // Count bonus symbols
      const bonusCount = result.filter(s => s === bonusSymbol).length;

      // Simulate reel stopping with different delays
      for (let i = 0; i < 3; i++) {
        await new Promise(resolve => setTimeout(resolve, 600 + i * 400));

        // Stop this reel
        const reel = reels[i];
        reel.classList.remove('spinning');

        // Set final symbol in the middle position
        reel.innerHTML = `
          <div class="symbol h-[60px] flex items-center justify-center text-5xl border-b border-t border-yellow-400">${result[i]}</div>
        `;

        // Add some final "settle" animation
        reel.style.transition = 'transform 0.2s';
        reel.style.transform = 'translateY(4px)';
        setTimeout(() => reel.style.transform = 'translateY(0)', 50);
      }

      // Calculate win
      setTimeout(() => {
        let winAmount = 0;
        const isWin = result[0] === result[1] && result[1] === result[2];

        if (isWin) {
          const multiplier = result[0] === bonusSymbol ? 25 : 
                           result[0] === '💎' ? 15 : 
                           result[0] === '⭐' ? 10 : 5;
          winAmount = currentBet * multiplier;
        } else if (bonusCount >= 2) {
          winAmount = currentBet * 2; // small scatter win
        }

        if (winAmount > 0) {
          balance += winAmount;
          balanceEl.textContent = '$' + balance.toLocaleString();

          if (winAmount >= currentBet * 10) {
            playSound('bigwin');
            showMessage(`BIG WIN! +$${winAmount}`, "lime");
            triggerConfetti();
          } else {
            playSound('win');
            showMessage(`WIN +$${winAmount}`, "green");
          }

          // Flash winning reels
          if (isWin) {
            reels.forEach(reel => reel.classList.add('win-flash'));
            setTimeout(() => reels.forEach(reel => reel.classList.remove('win-flash')), 2000);
          }
        } else {
          showMessage("BETTER LUCK NEXT TIME", "gray");
        }

        // Bonus Feature
        if (bonusCount === 3) {
          setTimeout(() => {
            playSound('bonus');
            showMessage("🎉 BONUS FEATURE TRIGGERED! 🎉", "yellow");
            triggerBonusRound();
          }, 1200);
        }

        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.style.opacity = "1";
      }, 800);
    }

    function triggerBonusRound() {
      showMessage("FREE FEATURE SPIN COMING...", "lime");
      setTimeout(() => {
        currentBet = Math.min(currentBet * 2, 500); // increase excitement
        betEl.textContent = '$' + currentBet;
        spin(); // auto spin with higher stakes feel
      }, 1800);
    }

    function showMessage(text, color) {
      messageEl.textContent = text;
      messageEl.style.color = color === "red" ? "#ef4444" : 
                             color === "lime" ? "#84cc16" : 
                             color === "green" ? "#22c55e" : "#eab308";
    }

    function triggerConfetti() {
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.textContent = ['💎','⭐','🎰','🛎️'][Math.floor(Math.random()*4)];
          confetti.style.position = 'fixed';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.top = '-20px';
          confetti.style.fontSize = '24px';
          confetti.style.zIndex = '9999';
          confetti.style.transition = 'all 3s linear';
          document.body.appendChild(confetti);

          setTimeout(() => {
            confetti.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random()*800}deg)`;
            confetti.style.opacity = '0';
          }, 50);

          setTimeout(() => confetti.remove(), 3500);
        }, i * 8);
      }
    }

    // Initialize
    window.onload = () => {
      createReelHTML();
      balanceEl.textContent = '$' + balance.toLocaleString();
      setBet(100);
      showMessage("GOOD LUCK!", "yellow");
    };
  </script>
</body>
</html>
