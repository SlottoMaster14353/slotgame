<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUANTUM GALAXIES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap');

    body {
      font-family: 'Exo 2', system-ui;
      background: linear-gradient(to bottom, #0a0a2e, #1a0033);
    }

    .reel {
      width: 92px;
      height: 192px;
      overflow: hidden;
      background: #0f0f2e;
      border: 6px solid #67e8f9;
      border-radius: 14px;
      box-shadow: 0 0 30px #22d3ee;
      position: relative;
    }

    .reel-strip {
      display: flex;
      flex-direction: column;
      transition: transform 2.4s cubic-bezier(0.23, 1, 0.32, 1);
      will-change: transform;
    }

    .symbol {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      border-bottom: 1px solid #334155;
      background: rgba(15, 15, 46, 0.85);
      position: relative;
    }

    .modal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);
      align-items:center;
      justify-content:center;
      z-index:50;
    }

    .modal-box {
      width:340px;
      background:#0f172a;
      border:2px solid #67e8f9;
      border-radius:16px;
      padding:18px;
    }

    .btn {
      padding:6px 10px;
      border-radius:10px;
      background:#111827;
      border:1px solid #374151;
    }

    .btn.active {
      border-color:#67e8f9;
    }

  </style>
</head>
<body class="min-h-screen py-8 text-white">

<div class="max-w-5xl mx-auto px-4">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-5xl font-bold bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
      QUANTUM GALAXIES
    </h1>

    <div class="text-right">
      <div class="text-xs opacity-70">BALANCE</div>
      <div id="balance" class="text-3xl font-bold text-emerald-400">50000</div>
    </div>
  </div>

  <!-- REELS -->
  <div class="flex justify-center gap-4 mb-10 bg-slate-950/70 p-6 rounded-3xl" id="reels"></div>

  <!-- BET CONTROLS -->
  <div class="flex flex-col items-center gap-3 mb-3">

    <div class="flex items-center gap-3">
      <button onclick="changeBet(-50)" class="btn">-</button>

      <div class="text-xl">BET: <span id="bet">100</span></div>

      <button onclick="changeBet(50)" class="btn">+</button>
    </div>

    <div class="flex gap-2 flex-wrap justify-center">
      <button onclick="setBet(50)" class="btn">50</button>
      <button onclick="setBet(100)" class="btn">100</button>
      <button onclick="setBet(250)" class="btn">250</button>
      <button onclick="setBet(500)" class="btn">500</button>
      <button onclick="setBet(1000)" class="btn">1000</button>
    </div>

    <input id="customBet" type="number" placeholder="custom bet" class="text-black px-2 py-1 rounded" />

  </div>

  <!-- CONTROLS -->
  <div class="flex justify-center gap-4 items-center">

    <button onclick="spin()" id="spinBtn" class="bg-pink-600 px-10 py-3 rounded-xl text-xl font-bold">
      SPIN
    </button>

    <button onclick="toggleAuto()" id="autoBtn" class="bg-yellow-500 px-4 py-2 rounded-xl text-black">
      AUTO: OFF
    </button>

    <button onclick="toggleTurbo()" id="turboBtn" class="bg-cyan-500 px-4 py-2 rounded-xl text-black">
      TURBO: OFF
    </button>

    <button onclick="showInfo()" class="w-12 h-12 bg-slate-700 rounded-xl">
      <i class="fas fa-info"></i>
    </button>

  </div>

  <div id="msg" class="text-center mt-4 h-6"></div>

</div>

<!-- INFO -->
<div id="infoModal" class="modal">
  <div class="modal-box text-center">
    <h2 class="text-cyan-300 text-xl mb-2">GAME INFO</h2>
    <p class="text-sm mb-2">5x3 Reels • 243 Ways • Weighted RNG</p>
    <p class="text-xs text-gray-400">Simulation slot system</p>
    <button onclick="closeInfo()" class="bg-red-500 px-4 py-2 rounded mt-3">CLOSE</button>
  </div>
</div>

<script>
const symbols=['⭐','🌙','🪐','🚀','💎','🔥','🌌'];

let balance=50000;
let bet=100;
let reels=[];
let spinning=false;
let auto=false;
let turbo=false;
let autoLoop=null;

function rand(){
  return symbols[Math.floor(Math.random()*symbols.length)];
}

function create(){
  const c=document.getElementById('reels');
  c.innerHTML='';
  reels=[];

  for(let i=0;i<5;i++){
    let reel=document.createElement('div');
    reel.className='reel';

    let strip=document.createElement('div');
    strip.className='reel-strip';

    for(let j=0;j<20;j++){
      let d=document.createElement('div');
      d.className='symbol';
      d.textContent=rand();
      strip.appendChild(d);
    }

    reel.appendChild(strip);
    c.appendChild(reel);
    reels.push(strip);
  }
}

function setBet(v){
  if(spinning) return;
  let custom=document.getElementById('customBet').value;
  if(custom) bet=parseInt(custom);
  else bet=v;
  update();
}

function changeBet(v){
  if(spinning) return;
  bet=Math.max(50,bet+v);
  update();
}

function update(){
  document.getElementById('bet').textContent=bet;
  document.getElementById('balance').textContent=balance;
}

function msg(t){document.getElementById('msg').textContent=t;}

async function spin(){
  if(spinning||balance<bet) return;
  spinning=true;

  balance-=bet;
  update();

  const speed = turbo ? 1200 : 2200;

  let grid=[];
  for(let i=0;i<5;i++){
    let col=[];
    for(let j=0;j<3;j++) col.push(rand());
    grid.push(col);
  }

  reels.forEach(r=>r.style.transform='translateY(-520px)');

  await new Promise(r=>setTimeout(r,speed));

  reels.forEach((r,i)=>{
    r.style.transition='none';
    r.style.transform='translateY(0)';
    r.innerHTML='';

    grid[i].forEach(s=>{
      let d=document.createElement('div');
      d.className='symbol';
      d.textContent=s;
      r.appendChild(d);
    });
  });

  msg(Math.random()<0.15 ? 'FEATURE SPIN 🎡' : 'RESULT');

  spinning=false;

  if(auto) setTimeout(spin,500);
}

function toggleAuto(){
  auto=!auto;
  document.getElementById('autoBtn').textContent='AUTO: '+(auto?'ON':'OFF');
  if(auto) spin();
}

function toggleTurbo(){
  turbo=!turbo;
  document.getElementById('turboBtn').textContent='TURBO: '+(turbo?'ON':'OFF');
}

function showInfo(){
  document.getElementById('infoModal').style.display='flex';
}
function closeInfo(){
  document.getElementById('infoModal').style.display='none';
}

window.onload=()=>{create();update();};
</script>

</body>
</html>
