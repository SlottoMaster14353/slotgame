<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUANTUM GALAXIES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Exo 2', system-ui;
      background: linear-gradient(to bottom, #0a0a2e, #1a0033);
    }
    
    .reel {
      width: 92px;
      height: 198px;
      overflow: hidden;
      background: #0f0f2e;
      border: 6px solid #67e8f9;
      border-radius: 14px;
      box-shadow: 0 0 30px #22d3ee;
      position: relative;
    }

    .reel-strip {
      display: flex;
      flex-direction: column;
      transition: transform 2.8s cubic-bezier(0.23, 1, 0.32, 1);
      will-change: transform;
    }

    .symbol {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      border-bottom: 2px solid #334155;
      background: rgba(15, 15, 46, 0.8);
      position: relative;
    }

    .locked::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 4px solid #c026d3;
      border-radius: 10px;
      animation: pulse 1.4s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 15px #67e8f9; }
      to { box-shadow: 0 0 40px #e879f9; }
    }

    .win-highlight {
      animation: glow 0.8s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 25px #67e8f9; }
      to { box-shadow: 0 0 55px #f472b6; }
    }

    /* INFO MODAL */
    .modal {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.85);
      align-items:center;
      justify-content:center;
      z-index:999;
    }

    .modal-box {
      width:340px;
      background:#0f172a;
      border:2px solid #67e8f9;
      border-radius:16px;
      padding:18px;
    }
  </style>
</head>
<body class="min-h-screen py-8 text-white">
  <div class="max-w-5xl mx-auto px-4">
    
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-5xl font-bold tracking-widest bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
        QUANTUM GALAXIES
      </h1>
      <div class="bg-black/80 border-4 border-yellow-400 rounded-2xl px-8 py-3 text-center">
        <div class="text-yellow-300 text-sm">GRAND JACKPOT</div>
        <div id="grandJackpot" class="text-4xl font-bold text-yellow-400">$12,500</div>
      </div>
    </div>

    <div class="flex justify-center gap-4 mb-10 bg-slate-950/70 p-8 rounded-3xl" id="reels"></div>

    <div class="flex items-center justify-between bg-slate-900/90 py-6 px-10 rounded-3xl">
      <div>
        <div class="text-xs opacity-70">BALANCE</div>
        <div id="balance" class="text-4xl font-bold text-emerald-400">$5,000</div>
      </div>

      <div class="text-center">
        <div class="text-xs opacity-70 mb-1">BET</div>
        <div class="flex gap-3">
          <button onclick="setBet(10)" class="bet-btn px-6 py-3 bg-slate-800 rounded-2xl text-sm">10</button>
          <button onclick="setBet(50)" class="bet-btn px-6 py-3 bg-slate-800 rounded-2xl text-sm">50</button>
          <button onclick="setBet(100)" class="bet-btn px-6 py-3 bg-slate-800 rounded-2xl text-sm active">100</button>
          <button onclick="setBet(250)" class="bet-btn px-6 py-3 bg-slate-800 rounded-2xl text-sm">250</button>
        </div>
      </div>

      <div>
        <div class="text-xs opacity-70">CURRENT BET</div>
        <div id="currentBet" class="text-4xl font-bold">$100</div>
      </div>

      <button onclick="spin()" id="spinBtn"
        class="bg-gradient-to-r from-pink-600 to-violet-600 px-16 py-7 text-3xl font-bold rounded-2xl">
        SPIN
      </button>

      <button onclick="showInfo()" class="w-14 h-14 bg-cyan-600 rounded-2xl">
        <i class="fas fa-info-circle"></i>
      </button>
    </div>

    <div id="message" class="text-center mt-8 text-2xl font-bold h-16"></div>
  </div>

  <!-- INFO MODAL FIXED -->
  <div id="infoModal" class="modal">
    <div class="modal-box text-center">
      <h2 class="text-xl text-cyan-300 mb-2">GAME INFO</h2>
      <p class="text-sm mb-3">5 Reels × 3 Rows • 243 Ways</p>
      <p class="text-xs text-gray-400 mb-4">Fair weighted RNG system simulation</p>
      <button onclick="closeInfo()" class="bg-red-500 px-4 py-2 rounded">CLOSE</button>
    </div>
  </div>

<script>
const reelStrip = ['⭐','🌟','🌙','🪐','☄️','🚀','🌌','🛸','🔥','💎','🌠','⚙️'];

let balance = 5000;
let currentBet = 100;
let isSpinning = false;
let reelElements = [];

function createReels(){
  const c=document.getElementById('reels');
  c.innerHTML='';
  reelElements=[];

  for(let i=0;i<5;i++){
    const reel=document.createElement('div');
    reel.className='reel';

    const strip=document.createElement('div');
    strip.className='reel-strip';

    for(let j=0;j<25;j++){
      const d=document.createElement('div');
      d.className='symbol';
      d.textContent=reelStrip[Math.floor(Math.random()*reelStrip.length)];
      strip.appendChild(d);
    }

    reel.appendChild(strip);
    c.appendChild(reel);
    reelElements.push(strip);
  }
}

function setBet(v){
  if(isSpinning) return;
  currentBet=v;
  document.getElementById('currentBet').textContent='$'+v;
}

function getSym(){
  return reelStrip[Math.floor(Math.random()*reelStrip.length)];
}

async function spin(){
  if(isSpinning||balance<currentBet) return;
  isSpinning=true;

  balance-=currentBet;
  document.getElementById('balance').textContent='$'+balance;
  showMsg('SPINNING...');

  const grid=[];
  for(let i=0;i<5;i++){
    const col=[];
    for(let j=0;j<3;j++) col.push(getSym());
    grid.push(col);
  }

  reelElements.forEach(r=>{
    r.style.transform='translateY(-500px)';
  });

  await new Promise(r=>setTimeout(r,2200));

  reelElements.forEach((r,i)=>{
    r.style.transition='none';
    r.style.transform='translateY(0)';
    r.innerHTML='';

    grid[i].forEach(s=>{
      const d=document.createElement('div');
      d.className='symbol';
      d.textContent=s;
      r.appendChild(d);
    });
  });

  isSpinning=false;
  showMsg('READY');
}

function showMsg(t){
  document.getElementById('message').textContent=t;
}

function showInfo(){
  document.getElementById('infoModal').style.display='flex';
}

function closeInfo(){
  document.getElementById('infoModal').style.display='none';
}

window.onload=createReels;
</script>

</body>
</html>
