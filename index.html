<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM GALAXIES</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap');
body{
  font-family:'Exo 2',system-ui;
  background:radial-gradient(circle at top,#141428,#05060f);
  color:white;
}

.reel{
  width:92px;
  height:192px;
  overflow:hidden;
  border-radius:14px;
  border:3px solid #67e8f9;
  background:#0b1220;
}

.reel-strip{
  display:flex;
  flex-direction:column;
  transition:transform 2.2s cubic-bezier(.2,.9,.2,1);
}

.symbol{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  border-bottom:1px solid #1f2a44;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  align-items:center;
  justify-content:center;
  z-index:50;
}
.modal-box{
  width:360px;
  background:#0f172a;
  border:2px solid #67e8f9;
  border-radius:16px;
  padding:16px;
}

.btn{padding:6px 10px;border-radius:10px;background:#111827;border:1px solid #374151}
.btn.active{border-color:#67e8f9}

#wheel{
  width:220px;height:220px;border-radius:50%;
  border:6px solid #fbbf24;
  margin:auto;
}
</style>
</head>
<body class="min-h-screen py-6">

<div class="max-w-6xl mx-auto px-4">

<div class="flex justify-between mb-4">
  <h1 class="text-4xl font-bold text-cyan-300">QUANTUM GALAXIES</h1>
  <div class="text-right">
    <div class="text-xs">BALANCE</div>
    <div id="balance" class="text-2xl text-emerald-400">50000</div>
  </div>
</div>

<!-- ADMIN BUTTON -->
<div class="mb-3">
  <button onclick="openAdmin()" class="btn text-yellow-300">ADMIN PANEL</button>
</div>

<!-- REELS -->
<div class="flex justify-center gap-4 mb-6" id="reels"></div>

<!-- BET -->
<div class="flex flex-col items-center gap-2">
<div class="flex gap-2 items-center">
<button class="btn" onclick="changeBet(-50)">-</button>
<div>BET: <span id="bet">100</span></div>
<button class="btn" onclick="changeBet(50)">+</button>
</div>

<div class="flex gap-2 flex-wrap justify-center">
<button class="btn" onclick="setBet(25)">25</button>
<button class="btn" onclick="setBet(50)">50</button>
<button class="btn" onclick="setBet(100)">100</button>
<button class="btn" onclick="setBet(500)">500</button>
</div>

<input id="customBet" type="number" class="text-black px-2 py-1 rounded" placeholder="custom bet">
</div>

<div class="flex justify-center gap-4 mt-4">
<button onclick="spin()" class="btn text-pink-300">SPIN</button>
<button onclick="toggleAuto()" class="btn">AUTO</button>
<button onclick="toggleTurbo()" class="btn">TURBO</button>
</div>

<div id="msg" class="text-center mt-3"></div>

</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="modal">
  <div class="modal-box text-center">
    <div id="loginBox">
      <h2 class="text-cyan-300 mb-2">ADMIN LOGIN</h2>
      <input id="adminPin" placeholder="PIN" class="text-black px-2 py-1 rounded w-full mb-2">
      <button onclick="checkAdmin()" class="btn w-full">ENTER</button>
    </div>

    <div id="adminPanel" style="display:none">
      <h2 class="text-yellow-300 mb-2">ADMIN PANEL</h2>
      <div class="text-sm mb-2">RTP CONTROL</div>
      <input id="rtp" type="range" min="85" max="98" value="92" oninput="setRTP()">
      <div>RTP: <span id="rtpVal">92</span>%</div>
      <button onclick="closeAdmin()" class="btn mt-3">CLOSE</button>
    </div>
  </div>
</div>

<script>
let balance=50000;
let bet=100;
let reels=[];
let spinning=false;
let auto=false;
let turbo=false;
let rtp=92;

const symbols=['⭐','🌙','🪐','🚀','💎','🔥','🌌'];

function rand(){
  let roll=Math.random()*100;
  if(roll>rtp) return '💀';
  return symbols[Math.floor(Math.random()*symbols.length)];
}

function create(){
  let c=document.getElementById('reels');
  c.innerHTML='';
  reels=[];

  for(let i=0;i<5;i++){
    let reel=document.createElement('div');
    reel.className='reel';
    let strip=document.createElement('div');
    strip.className='reel-strip';

    for(let j=0;j<18;j++){
      let d=document.createElement('div');
      d.className='symbol';
      d.textContent=rand();
      strip.appendChild(d);
    }

    reel.appendChild(strip);
    c.appendChild(reel);
    reels.push(strip);
  }
}

function setBet(v){
  if(spinning) return;
  let c=document.getElementById('customBet').value;
  bet=c?parseInt(c):v;
  update();
}

function changeBet(v){
  if(spinning) return;
  bet=Math.max(25,bet+v);
  update();
}

function update(){
  document.getElementById('bet').textContent=bet;
  document.getElementById('balance').textContent=balance;
}

function msg(t){document.getElementById('msg').textContent=t;}

async function spin(){
  if(spinning||balance<bet) return;
  spinning=true;

  balance-=bet;
  update();

  let grid=[];
  for(let i=0;i<5;i++){
    let col=[];
    for(let j=0;j<3;j++) col.push(rand());
    grid.push(col);
  }

  reels.forEach(r=>r.style.transform='translateY(-520px)');

  await new Promise(r=>setTimeout(r,turbo?1200:2200));

  reels.forEach((r,i)=>{
    r.style.transition='none';
    r.style.transform='translateY(0)';
    r.innerHTML='';

    grid[i].forEach(s=>{
      let d=document.createElement('div');
      d.className='symbol';
      d.textContent=s;
      r.appendChild(d);
    });
  });

  msg(Math.random()<0.15?'FEATURE SPIN 🎡':'SPIN DONE');

  spinning=false;
  if(auto) setTimeout(spin,500);
}

function toggleAuto(){auto=!auto; if(auto) spin();}
function toggleTurbo(){turbo=!turbo;}

function openAdmin(){document.getElementById('adminModal').style.display='flex';}
function closeAdmin(){document.getElementById('adminModal').style.display='none';}

function checkAdmin(){
  let pin=document.getElementById('adminPin').value;
  if(pin==='3566'||pin==='ACFD'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
  }
}

function setRTP(){
  rtp=document.getElementById('rtp').value;
  document.getElementById('rtpVal').textContent=rtp;
}

window.onload=create;
</script>

</body>
</html>
